name: Return Companies to Master

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test with'
        required: true
        type: number

jobs:
  return-to-master:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Find beta deployment comments
        id: find_companies
        uses: actions/github-script@v7
        with:
          script: |
            // Get PR number from either event or manual input
            const prNumber = context.payload.pull_request?.number || context.payload.inputs?.pr_number;

            if (!prNumber) {
              console.log('No PR number found');
              return { company_ids: [], should_deploy: false };
            }

            console.log('Testing with PR #' + prNumber);

            // Obtener todos los comentarios del PR
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            
            // Buscar el último comentario con /beta-deploy
            const betaComments = comments.data
              .filter(comment => comment.body.includes('/beta-deploy'))
              .reverse(); // Más reciente primero
            
            if (betaComments.length === 0) {
              console.log('No beta deployment found, skipping...');
              return { company_ids: [], should_deploy: false };
            }
            
            // Extraer los IDs del comentario más reciente
            const lastComment = betaComments[0];
            const match = lastComment.body.match(/\/beta-deploy\s+([\d,\s]+)/);
            
            if (!match) {
              console.log('Invalid format in comment, skipping...');
              return { company_ids: [], should_deploy: false };
            }
            
            // Parsear los IDs (soporta: "123,456,789" o "123, 456, 789")
            const companyIds = match[1]
              .split(',')
              .map(id => id.trim())
              .filter(id => id.length > 0 && /^\d+$/.test(id));
            
            console.log('Found company IDs:', companyIds);
            
            return {
              company_ids: companyIds,
              should_deploy: companyIds.length > 0,
              comment_url: lastComment.html_url
            };

      - name: Return companies to master branch
        if: fromJSON(steps.find_companies.outputs.result).should_deploy
        env:
          COMPANY_IDS: ${{ join(fromJSON(steps.find_companies.outputs.result).company_ids, ',') }}
        run: |
          echo "Returning companies to master: $COMPANY_IDS"