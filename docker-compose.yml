version: "3.8"

services:
  thunder-bot:
    build: .
    container_name: thunder-bot
    restart: unless-stopped
    environment:
      # Slack Configuration
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - TEAM_ID=${TEAM_ID}
      - SOURCE_CHANNEL_IDS=${SOURCE_CHANNEL_IDS}
      - DEST_CHANNEL_IDS=${DEST_CHANNEL_IDS}
      - ALLOWED_COMMAND_CHANNEL=${ALLOWED_COMMAND_CHANNEL}
      # Discord Configuration
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      # Database Configuration
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
      # - DB_PATH=/app/data/thunderteam.db
    # volumes:
    #   # Mount data directory for SQLite persistence (if using SQLite)
    #   - ./data:/app/data
    #   # Optional: Mount logs directory
    #   - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "print('Bot is running')"]
      interval: 30s
      timeout: 10s
      retries: 3
